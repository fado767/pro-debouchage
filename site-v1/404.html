/* ---------- fonts ---------- */

   Change that copy and the missing letters silently fall back to a system script face, so build.js

/* ---------- tokens ---------- */
:root{
  --ink:#102A4A;--ink-2:#1B3D66;--cta:#D63A17;--cta-press:#B72F11;
  --teal:#0B7A70;--teal-soft:#E6F2F0;--mark:#FFD635;
  --paper:#F6F3EE;--card:#FFFCF7;--line:#E2DCD3;--line-ink:rgba(16,42,74,.16);--star:#F0A83C;
  --text:#1B2733;--muted:#5A6672;--on-ink-muted:#C8D6E6;
  --font:'Archivo','Archivo Fallback',system-ui,sans-serif;
  --t-display:clamp(2.875rem,1.3rem + 7.8vw,6.75rem);
  --t-h2:clamp(2.15rem,1.25rem + 4.2vw,4.125rem);
  --t-h3:clamp(1.3rem,1.15rem + .7vw,1.5rem);
  --t-lead:clamp(1.0625rem,1rem + .35vw,1.25rem);
  --t-body:clamp(1rem,.97rem + .2vw,1.125rem);
  --t-label:.8125rem;
  --wrap:1160px;--gut:20px;
  --bar-h:72px;
  /* ONE timing for the sticky bar and the guarantee badge that rides it. They MUST stay equal or
     the two stop moving as one object. Fady 2026-08-27: 250ms "jumped suddenly"; 420ms on an
     out-quint curve read as UNCHANGED to him, and he was right, because out-quint covers two thirds
     of the distance in the first fifth of the time, so a longer duration only lengthens the tail
     nobody sees. The fix is the CURVE, not the number: a standard ease-in-out spends real time
     accelerating, so the bar reads as arriving instead of appearing. 480ms with a fade on top. */
  --cb-dur:.48s;--cb-ease:cubic-bezier(.4,0,.2,1);
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  --stretch-d:80%;--stretch-tight:-0.03em;--track-title:-.02em;--track-label:.09em;
  --r-btn:10px;--r-img:12px;--r-card:14px;--r-dot:2px;
  /* THE ALL-CAPS SWITCH (Fady 2026-08-26, may be reverted). These three lines govern every section
     heading: the H2s, the service titles, the scam and situation h3s, the equipment tile titles and
     the legal-page H1. TO REVERT, set exactly:  --case-head:uppercase; --track-head:-.03em; --lh-head:1.0
     Deliberately NOT on the switch: the hero H1 (the signature, stays in caps) and the small labels
     (kicker, eyebrow, chips, slider labels, footer legal label) which are labels, not headings. */
  --case-head:none;--track-head:-.02em;--lh-head:1.05;
  color-scheme:light;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px;scroll-padding-bottom:calc(var(--bar-h) + 24px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;font-family:var(--font);font-weight:400;font-size:var(--t-body);line-height:1.6;color:var(--text);
  background:var(--paper);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));
}
@media (min-width:1000px){body{padding-bottom:0}}
img{max-width:100%;height:auto;display:block}
a{color:var(--ink)}
p{margin:0 0 1em}
h1,h2,h3{margin:0;color:var(--ink)}
h2{font-size:var(--t-h2);font-weight:900;font-stretch:var(--stretch-d);letter-spacing:var(--track-head);line-height:var(--lh-head);text-transform:var(--case-head);text-wrap:balance;padding-top:.08em}
h3{font-size:var(--t-h3);font-weight:900;line-height:1.25}
/* every sub/intro paragraph on the page is this one object at one weight (v2's), so no section
   invents its own bold sub text; emphasis inside it is carried by .hl, never by extra weight */
.lead{font-size:var(--t-lead);font-weight:400;max-width:62ch;text-wrap:pretty}
.lead strong,.lead b{font-weight:600}
/* the marker is a background only: it never changes weight, so it works inside a 400 lead and
   inside the 900 promise line alike */
.hl{background:linear-gradient(transparent 60%,var(--mark) 60%);padding-inline:2px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
.tnum{font-variant-numeric:tabular-nums}
.visually-hidden,.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:12px 16px;z-index:300}
.skip:focus{left:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* section rhythm: kicker, big H2, mark rule.
   Tightened 2026-08-26 (Fady): the old clamp left too much air between every band. */
section{padding-block:clamp(44px,6.4vw,84px)}
/* TWO BANDS ON THE SAME BACKGROUND HAVE NO SEAM, so their two paddings read as one dead gap: 168px
   of nothing between "Notre façon de travailler" and the equipment band (Fady 2026-08-27, and the
   same fault the before/after band was fixed for on 2026-08-26). The LOWER band gives up its top
   padding and the band above supplies the whole separation, so a colour change is worth two
   paddings and a shared colour is worth one. General on purpose: reorder the sections and the
   rhythm still holds. */
.s-paper + .s-paper,.s-card + .s-card,.s-ink + .s-ink{padding-top:0}
.kicker{font-size:var(--t-label);font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--teal);margin:0 0 10px}
.s-ink .kicker{color:var(--mark)}
.rule{border:0;width:64px;height:5px;border-radius:var(--r-dot);background:var(--mark);margin:18px 0 26px}
.s-paper{background:var(--paper)}
.s-card{background:var(--card)}
.s-ink{background:var(--ink);color:#fff}
.s-ink h2,.s-ink h3{color:#fff}
.s-ink p{color:var(--on-ink-muted)}
.s-ink .lead{color:#fff}

/* ---------- buttons ----------
   The pair is ONE object in two colours (Fady 2026-08-26): identical height, type size, padding,
   radius and seat. Only the fill and the border say which one is primary. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:800;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;border:2px solid transparent;border-radius:var(--r-btn);min-height:64px;padding:10px 26px;font-size:1.125rem;transition:transform .09s ease-out,background-color .18s ease}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;fill:currentColor;flex:0 0 auto}
.btn-call{background:var(--cta);color:#fff;box-shadow:0 3px 0 var(--cta-press)}
.btn-call:hover,.btn-call:focus-visible{background:var(--cta-press);box-shadow:0 3px 0 #8E2409}
.btn-wa{background:var(--teal-soft);color:var(--teal);border-color:var(--teal);box-shadow:0 3px 0 rgba(11,122,112,.3)}
.btn-wa:hover,.btn-wa:focus-visible{background:#D8EAE7}
/* On the dark band the WhatsApp button used to be a hollow outline standing beside a solid red one,
   so the pair stopped being one object (Fady 2026-08-27). It is FILLED here, in the brand teal with
   white on it, exactly like the WhatsApp key in the mobile call bar: same shape, same height, same
   ledge as its partner, only the colour saying which one is primary. */
.s-ink .btn-wa{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 0 #08554E}
.s-ink .btn-wa:hover,.s-ink .btn-wa:focus-visible{background:#0A6A61;border-color:#0A6A61}
/* one column on phones, both auto and side by side from 56rem: neither label shrinks its button */
.actions .btn{width:100%;max-width:460px}
@media (min-width:56rem){.actions .btn{width:auto;max-width:none}}
/* The ONE deliberate exception to the single button size: a secondary action that must not compete
   with "Appeler". Used once, on the review invitation (Fady 2026-08-27). */
.btn-sm{min-height:50px;padding:8px 20px;font-size:1rem}
.btn-sm svg{width:18px;height:18px}
.btn-ghost{border-color:var(--ink);color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.link-call{color:var(--cta);font-weight:800;text-decoration-thickness:2px;text-underline-offset:4px}
.link-call:hover{color:var(--cta-press)}

/* ---------- header ---------- */
/* The header scrolls away with the page (Fady 2026-08-26 morning): the sticky bottom call bar is
   the one persistent element; nobody switches language mid-scroll. */
.site-header{position:relative;z-index:150;background:var(--paper);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.site-header .logo{display:flex;align-items:center}
.site-header .logo img{width:auto;height:34px}
.langswitch{display:flex;background:var(--teal-soft);border-radius:12px;padding:4px;margin-left:auto}
.langswitch a{display:grid;place-items:center;min-width:44px;min-height:36px;border-radius:8px;text-decoration:none;font-weight:800;font-size:.875rem;color:var(--teal)}
.langswitch a[aria-current]{background:var(--teal);color:#fff}
.langswitch a:not([aria-current]):hover{background:rgba(255,255,255,.7)}
.header-call{display:none}
@media (min-width:1000px){
  .langswitch{margin-left:auto}
  .header-call{display:inline-flex;min-height:48px;padding:6px 20px;font-size:1rem;box-shadow:0 2px 0 var(--cta-press);margin-left:14px;width:auto}
}
main{padding-top:0}

/* ---------- hero ---------- */
.hero{padding-block:clamp(28px,4vw,46px) 0;overflow:clip}
.eyebrow{font-size:var(--t-label);font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--muted);margin:0 0 18px}
/* The H1 must fill the line but NEVER touch the edge, in any language, at any width. The wrap is a
   size container and each language carries its measured cap (longest pain line, ~90% of the wrap).
   Browsers without container units use the --h1-fit fallback factors. */
.hero .wrap{container-type:inline-size}
.hero h1{font-size:calc(var(--t-display) * var(--h1-fit,1));font-size:min(var(--t-display),var(--h1-cap,200cqw));font-weight:900;font-stretch:var(--stretch-d);letter-spacing:var(--stretch-tight);line-height:.96;text-transform:uppercase;padding-top:.09em}
html[lang="fr-BE"]{--h1-fit:.87;--h1-cap:13.9cqw}
html[lang="en-BE"]{--h1-fit:.75;--h1-cap:11.5cqw}
html[lang="nl-BE"]{--h1-fit:.65;--h1-cap:9.9cqw}
.hero h1 .h1b{background:var(--mark);color:var(--ink);padding:.04em .14em .06em;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.12}
.hero-grid{display:block}
.hero .sub{font-size:var(--t-lead);max-width:56ch;margin:24px 0 0;text-wrap:pretty}
@media (min-width:56rem){.hero .sub{font-size:1.375rem;margin-top:34px}}
.hero .sub strong{background:linear-gradient(transparent 62%,var(--mark) 62%);font-weight:800}
.hero .actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:26px}
/* the line under the CTAs is a TIP, not a second promise: light body type, one marked word
   carrying the weight (Fady 2026-08-26, the old semi-bold two-liner competed with the sub) */
.under-btn{font-size:.9375rem;font-weight:400;color:var(--muted);margin:14px 0 0;max-width:46ch}
.under-btn b{font-weight:800;color:var(--ink);background:linear-gradient(transparent 60%,var(--mark) 60%);padding-inline:3px}
.wa-note{font-size:.875rem;color:var(--muted);margin:6px 0 0}

/* image ticker (>=820px): pure CSS marquee, two identical sets each translating -100% */
/* the strip sits directly ON the blue band: its own bottom hairline is the seam (Fady 2026-08-26) */
.ticker{display:none;margin-top:clamp(26px,4vw,44px);margin-bottom:0;padding-block:16px;border-block:1px solid var(--line-ink);background:var(--card)}
.tick-row{overflow:hidden;display:flex}
.tick-set{display:flex;flex:0 0 auto;min-width:max-content;will-change:transform;animation:tick-scroll var(--tick-dur,80s) linear infinite}
/* 80s per copy of the strip x TICK_REPEAT copies per set (template.js): keep them in step. */
.ticker .tick-set{--tick-dur:160s}
.tick-item{flex:0 0 auto;height:250px;margin-right:16px}
.tick-item img{height:100%;width:auto;object-fit:cover;border-radius:var(--r-img)}
@media (min-width:820px){.ticker{display:block}.hero-car{display:none}}
@keyframes tick-scroll{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){
  .tick-set{animation:none}
  .tick-set[aria-hidden="true"]{display:none}
  .ticker .tick-set{flex-wrap:wrap;min-width:0}
}
/* mobile swipe carousel */
.hero-car{position:relative;margin-top:26px;margin-bottom:34px}
.car-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);padding-inline:var(--gut);overscroll-behavior-x:contain;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.car-slide{flex:0 0 78vw;max-width:380px;scroll-snap-align:start}
.car-slide img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-img)}
/* THE SWIPE HINT replaces the dots (Fady 2026-08-27): dots say "there are 10 photos", which nobody
   needs. THE CHIP ITSELF IS THE ARROW (his second note, same day): a banner running in from the left
   edge of the screen and ending in a point aimed the way the photos move, instead of a rounded pill
   with a little arrow drawn inside it. It bleeds off the left edge, lands on the bottom-left corner
   of the first photo, and sits on .hero-car rather than inside the scroller, so the photos travel
   under it. It STAYS: it used to fade on first touch, which meant it vanished the instant you
   touched the thing it was pointing at. The point is cut with clip-path, so the shadow has to be a
   filter (a box-shadow would be clipped away with the corners). */
.car-hint{position:absolute;left:0;bottom:14px;z-index:3;margin:0;display:flex;align-items:center;
  padding:11px 30px 11px 20px;background:var(--ink);color:#fff;font-weight:800;font-size:.875rem;
  letter-spacing:-.01em;white-space:nowrap;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);
  filter:drop-shadow(0 4px 10px rgba(16,42,74,.32))}

/* ---------- trust marquee ---------- */
.trust{background:var(--ink);padding-block:0;border-block:0}
.trust ul{list-style:none;display:flex;margin:0;padding:16px 0;gap:0}
.trust li{color:#fff;font-weight:600;font-size:.9875rem;white-space:nowrap;display:flex;align-items:center;gap:12px;padding-inline:18px}
.trust li::before{content:"";width:10px;height:10px;border-radius:var(--r-dot);background:var(--mark);flex:0 0 auto}
/* the band and the first section under it were floating apart (Fady 2026-08-26).
   :not(.trust) so the mobile twin of the band keeps its own zero padding. */
.trust + section:not(.trust){padding-top:clamp(38px,5vw,64px)}
.trust-t{overflow:hidden;display:none}
.trust-t .tick-row{overflow:hidden}
/* 46s per copy of the list x TRUST_REPEAT copies per set (template.js): keep them in step or the
   strip changes speed. */
.trust-t .tick-set{--tick-dur:138s;animation-direction:reverse}
.trust-t .tick-set > ul{flex:0 0 auto}
@media (min-width:820px){.trust-t{display:block}.trust-s{display:none}}
.trust-s ul{flex-direction:column;gap:4px;padding:18px var(--gut)}
.trust-s li{white-space:normal;padding-inline:0}
.trust-s{padding-block:0}
.trust-s .wrap{padding-inline:0}

/* ---------- services: numbered editorial rows ---------- */
.servlist{list-style:none;margin:0;padding:0;counter-reset:serv}
.servlist li{counter-increment:serv;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;padding:22px 0;border-bottom:1px solid var(--line-ink);align-items:start}
.servlist li::before{content:"0" counter(serv);grid-row:1/span 3;font-weight:900;font-stretch:82%;font-size:clamp(2.2rem,1.4rem + 4vw,3.9rem);line-height:.82;margin-top:.07em;color:var(--ink);letter-spacing:-.03em}
.servlist h3{font-size:clamp(1.5rem,1.2rem + 1.5vw,2rem);font-weight:900;text-transform:var(--case-head);font-stretch:100%;letter-spacing:var(--track-head);line-height:1.15;padding-top:.06em}
.servlist p{margin:0;max-width:60ch;color:var(--text)}
.servlist .link-call{font-size:.9875rem}
@media (min-width:56rem){
  .servlist li{grid-template-columns:110px minmax(0,1.15fr) minmax(0,1fr) auto;align-items:center}
  .servlist li::before{grid-row:auto;margin-top:0;line-height:1}
  .servlist p{grid-column:3}
  .servlist .link-call{grid-column:4;justify-self:end}
}
/* hover: the quiet lift ONLY, and only where a real pointer exists. The row-wide highlight is gone
   (Fady 2026-08-26): it ran edge to edge behind the "Appeler" link, and a stray touch on a phone
   left the row painted. @media (hover:hover) means a touchscreen never sees any of this. */
.servlist li{position:relative}
@media (hover:hover){
  .servlist li::before{transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .servlist li h3{transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .servlist li:hover::before{transform:translateY(-5px)}
  .servlist li:hover h3{transform:translateY(-2px)}
}

/* ---------- steps ---------- */
.steps{position:relative;display:grid;gap:34px;max-width:760px;counter-reset:step}
.steps::before{content:"";position:absolute;left:26px;top:10px;bottom:10px;width:2px;background:var(--line)}

.step .n{width:52px;height:52px;border-radius:var(--r-btn);background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.375rem;position:relative;z-index:1;transition:background-color .4s ease,color .4s ease,box-shadow .4s ease}
.step .n::before{content:counter(step)}
/* the line fills and the numbers light up one after the other when the section arrives (JS adds .go) */
.steps::after{content:"";position:absolute;left:26px;top:10px;bottom:10px;width:2px;background:var(--mark);transform-origin:top;transform:scaleY(0);transition:transform 1.5s cubic-bezier(.22,1,.36,1)}
.steps.go::after{transform:scaleY(1)}
.steps.go .step .n{background:var(--ink);color:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.steps.go .step:nth-child(1) .n{transition-delay:.1s}

@media (prefers-reduced-motion:reduce){.steps::after{transition:none;transform:scaleY(1)}.step .n{transition:none;background:var(--ink);color:#fff}}

/* THE YELLOW MARKER UNDER EACH AMOUNT (Fady 2026-08-26). Same idea as .hl, the page's highlighter.
   It is a background gradient, not a pseudo-element: a ::after with z-index:-1 would fall behind the
   section's own background and vanish, since nothing here opens a stacking context.
   NO ANIMATION, and that is the decision, not an omission: the rows were staggered in one by one and

/* ---------- before / during / after: one job in three photos ---------- */
/* Replaced the drag slider on 2026-08-26 (Fady): the section needed imagery and needed to SHOW the
   technician working, which a two-photo wipe hid. Rebuilt the same evening to FADY'S OWN Figma
   composition, then refined on his notes: smaller arrows (a hint, not a shout), a DRAWN wobbly edge
   instead of a CSS border, and no white gap between photo and edge.
   HOW IT HOLDS TOGETHER: every photo and arrow is placed in PERCENT inside one aspect-ratio box, so
   the whole collage scales as a unit. Change a percentage, never a pixel, or the overlaps drift at
   widths nobody tested. Two compositions only: a portrait cascade under 56rem, a wide row above it.
   THE PHONE RULE, learned the hard way: photo 3 must clear the BOWL of photo 1, the dirty water,
   which sits at about 34 to 64 percent ACROSS and 71 to 90 percent DOWN, the bottom right of the
   photo. Cover that and the first photo shows a clean wall and a seat, which tells the visitor
   nothing. CORRECTED 2026-08-26 by opening the file and looking: the old note here said 19 to 38
   across and 42 to 51 down, which is the SEAT AND LID, and it survived the before-photo swap. Any
   repositioning has to keep the real corner free, and the check has to be made against the image,
   never against this comment alone.
   THE STICKER COLOURS ARE THE PAGE'S OWN TOKENS (Fady, 2026-08-26, replacing the brighter Figma
   yellow and turquoise): --ink on the before photo, --teal during, and --cta, the red of the call
   button, on the after photo, so the resolved state carries the colour the visitor is asked to act on. */
/* services and this band share the same background, so their two paddings stacked into 164px of
   dead white with the kicker floating in it (Fady, 2026-08-26). The band keeps no top padding of
   its own: the section above supplies the whole separation, one rhythm instead of two. */
.s-ba{position:relative;z-index:2;padding-block:0}
/* The next band starts under the overhanging photos, so its heading needs the room back. The
   overhang is a share of the collage WIDTH, not a fixed number, so the give-back is a percentage
   (percentage padding resolves against width): a fixed 68px was down to 4px of clearance at 880px
   and left 93px of white at 1280px. The wide row hangs far less than the phone cascade and needs
   no extra push at all. Measured 2026-08-26; re-measure if a photo's top or width changes. */
.s-ba + section{padding-top:calc(clamp(44px,6.4vw,84px) + 22.5%)}
@media (min-width:56rem){.s-ba + section{padding-top:max(clamp(44px,6.4vw,84px),78px)}}
.ba-collage{--st-1:var(--ink);--st-2:var(--teal);--st-3:var(--cta);position:relative;z-index:2;margin-top:36px;aspect-ratio:80/90}
.ba-defs{position:absolute;width:0;height:0;overflow:hidden}
.ba-pics{list-style:none;margin:0;padding:0}
.ba-pic{position:absolute;margin:0;border-radius:16px;box-shadow:0 8px 20px rgba(16,42,74,.13)}
.ba-pic picture{display:block}
.ba-pic img{display:block;width:100%;height:auto;border-radius:16px}
.ba-pic-1{z-index:1}
.ba-pic-2{z-index:2}
.ba-pic-3{z-index:3}
/* the drawn edge: sits over the photo, a touch askew, and is allowed to wobble past its own box */
.ba-edge{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ba-pic-1 .ba-edge{rotate:.7deg}
.ba-pic-2 .ba-edge{rotate:-.6deg}
.ba-pic-3 .ba-edge{rotate:.5deg}
.ba-ar{position:absolute;z-index:4;display:block}
.ba-ar img{display:block;width:100%;height:auto}
.only-wide{display:none}
/* phone: the cascade, top left to bottom right, the way Fady drew it. Photo 3 is pushed right and
   down so the blocked bowl in photo 1 stays in the open. */
.ba-pic-1{left:1%;top:13%;width:53%;rotate:-4deg}
.ba-pic-2{left:48%;top:0%;width:50%;rotate:3deg}
.ba-pic-3{left:44%;top:62%;width:53%;rotate:-2.5deg}
.ba-ar-1{left:38%;top:6%;width:16.5%;rotate:-14deg}
.ba-ar-3{left:82.5%;top:53%;width:11%}
/* THE HANDWRITTEN NOTE (Fady 2026-08-27, from his own composition): two short lines in Caveat with
   a yellow swoosh under the number, the first piece of the "one pen" pass that will eventually
   redraw the arrows too. Placed like everything else here, in PERCENT of the collage box.
   Phone: the empty bottom-left corner, exactly where Fady drew it, clear of photo 3 (left 44%).
   Wide: ABOVE the collage, hard right, over the after photo's column. Measured on the live page
   2026-08-27: the wide row is packed edge to edge (the widest gap between two photos is 60px) but
   the heading block beside it is empty from x=680 to the right margin, because the H2 never runs
   past two thirds of the wrap in any of the three languages. Anchored to the RIGHT edge, not to a
   left percentage, so a narrower desktop cannot walk it back into the headline. */
.ba-note{position:absolute;z-index:5;margin:0;font-family:var(--hand);font-weight:600;
  color:var(--ink);line-height:.95;white-space:nowrap;rotate:-7deg;transform-origin:left bottom;
  pointer-events:none}
.ba-note > span{display:block}
.ba-note > span.ba-note-2{position:relative;display:inline-block}
.ba-note-u{position:absolute;left:-3%;bottom:-.16em;width:106%;height:auto;overflow:visible}
.ba-note{left:6%;top:79%;font-size:clamp(1.4rem,6.9vw,2.4rem)}
@media (min-width:56rem){
  .ba-collage{aspect-ratio:330/100}
  .only-wide{display:block}
  .only-narrow{display:none}
  /* Bottoms sit level, tops stagger (Fady 2026-08-26): the before photo is the anchor and does not
     move; Afrem and the after photo come up so the row stops hanging raggedly into the white below.
     Photo 2 is the tallest, so it is the one that rises above the box. */
  .ba-pic-1{left:4%;top:4%;width:25%;rotate:-3.5deg}
  .ba-pic-2{left:36%;top:-3.5%;width:27%;rotate:2deg}
  .ba-pic-3{left:69%;top:4%;width:25%;rotate:-2.5deg}
  .ba-ar-1{left:27%;top:30%;width:8.6%;rotate:-6deg}
  .ba-ar-2{left:61%;top:41.5%;width:9%;rotate:4deg}
  /* The note lives in the band between the heading and the photos, so that band has to be tall
     enough to hold it at every width. 64px instead of 36 buys 96px of clearance against a note
     that is at most ~80px tall; without it the Dutch heading, which runs to 95% of the wrap at
     900px, ends 15px above the note's first letter. This white is OCCUPIED, not dead. 80px and a
     24px standoff after Fady asked for more air around the note (2026-08-27): the photos are left
     alone, the room comes from the band the note lives in. */
  .ba-collage{margin-top:80px}
  .ba-note{left:auto;right:0;top:auto;bottom:calc(100% + 24px);transform-origin:right bottom;
    font-size:clamp(1.5rem,2.6vw,2.2rem);rotate:-8deg;text-align:right}
}
@media (prefers-reduced-motion:reduce){.ba-pic,.ba-edge{rotate:none}}

/* ---------- scam band: signs vs us ---------- */
.scam-cols{display:grid;gap:40px;margin-top:8px}
@media (min-width:56rem){.scam-cols{grid-template-columns:1fr 1fr;gap:64px}}

/* Scoped to THIS band's own button (Fady 2026-08-27). As `.s-ink .btn-call` it also hit the final

/* ---------- the cited fact: an inline source the visitor can open in place ----------
   Fady 2026-08-26: the victim number is the one hard claim on the page, so it has to be checkable
   without sending anybody to a news site and losing them. The phrase is a button, marked with the
   page's yellow, and it opens a real dialog carrying the prosecutor's date, the file and the
   publications. Nothing here leaves the page. */
.cite{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;display:inline;-webkit-tap-highlight-color:transparent}
.cite .cite-t{background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-position:0 92%;background-size:100% .18em;padding-bottom:.06em;transition:background-size .18s ease}
.cite:hover .cite-t,.cite:focus-visible .cite-t{background-size:100% .55em}
.cite .cite-i{display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-left:.35em;border-radius:50%;background:var(--mark);color:var(--ink);font-size:.7em;font-weight:900;line-height:1;transform:translateY(-.15em)}
.cite:focus-visible{outline:3px solid var(--mark);outline-offset:3px;border-radius:3px}
.cite-back{position:fixed;inset:0;background:rgba(16,42,74,.55);z-index:60}
.cite-pop{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:min(80vh,640px);overflow:auto;background:var(--card);color:var(--text);border-radius:var(--r-card);padding:clamp(22px,4vw,34px);box-shadow:0 24px 60px rgba(16,42,74,.3)}
.cite-pop[hidden],.cite-back[hidden]{display:none}
.cite-pop h3{margin:0 0 12px;color:var(--ink);font-size:clamp(1.25rem,1.1rem + .9vw,1.6rem)}

.cite-pop .cite-src{font-size:.875rem;color:var(--muted)}
.cite-pop .cite-why{border-left:4px solid var(--mark);padding-left:14px;margin-bottom:20px;color:var(--ink);font-weight:600}
.cite-x{font:inherit;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;border:0;border-radius:var(--r-btn);padding:12px 22px}
.cite-x:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* ---------- who comes: the paragraph, Afrem speaking, then the van ----------
   Rebuilt 2026-08-26 (Fady): the old .split put the van beside three unlabelled text blocks and the

   .split is kept because other bands still use it. */
.split{display:grid;gap:30px;margin-top:8px}

/* Afrem's line. A chat bubble, because that is the one shape everybody reads as a person talking.
   The avatar ring is the brand gradient (ink to teal, with the yellow at the far stop) and the
   monogram inside is a PLACEHOLDER until Roro sends a face photo: never an invented face. */
.bub-row{display:flex;align-items:flex-start;gap:clamp(12px,2.2vw,18px);margin:30px 0 0;max-width:660px}
.bub-av{position:relative;flex:0 0 auto;width:clamp(58px,11vw,76px);height:clamp(58px,11vw,76px);border-radius:50%;padding:3px;background:linear-gradient(145deg,var(--ink) 0%,var(--teal) 62%,var(--mark) 100%);box-shadow:0 6px 18px rgba(16,42,74,.18)}
.bub-av img,.bub-mono{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--ink);color:#fff;font-weight:900;font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:0}
.bub{position:relative;background:linear-gradient(160deg,var(--teal-soft) 0%,var(--card) 68%);border:1px solid var(--line);border-radius:var(--r-card);border-top-left-radius:6px;padding:clamp(14px,2.4vw,20px) clamp(16px,2.8vw,24px);box-shadow:0 8px 22px rgba(16,42,74,.08)}
/* the tail, drawn as a rotated square so the bubble's own border carries through it */
.bub::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:var(--teal-soft);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:2px}

.inc-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--acc)}

.honest-card{background:var(--card);border-top:5px solid var(--mark);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:var(--r-card);padding:26px;max-width:760px}
.honest-card ul{padding:0;list-style:none;display:grid;gap:10px;margin:14px 0}
.honest-card li{display:flex;gap:12px;align-items:flex-start}
.honest-card li::before{content:"";flex:0 0 10px;width:10px;height:10px;margin-top:8px;border-radius:var(--r-dot);background:var(--teal)}
.ask{color:var(--muted)}
/* the line under the cards sat flush against them (margin-top 0, Fady 2026-08-26). Scoped to the
   card grid: the same .ask inside .honest-card follows a list and keeps that block's own rhythm. */
.reviews + .ask{margin-top:clamp(20px,2.6vw,30px)}

/* ---------- one real review, featured (Fady 2026-08-27; the grid above is parked) ----------
   Deliberately ONE wide card, not a lonely third of the grid: teal top bar like the honest card's
   mark, an oversized opening quote in the house teal, the words at reading size, the person last.
   No stars anywhere: he wrote words, not a rating. */
.feat-card{position:relative;background:#fff;border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:var(--r-card);padding:34px 28px 26px;max-width:760px;box-shadow:0 10px 26px rgba(16,42,74,.08)}
.feat-mark{position:absolute;top:2px;left:22px;font-size:4.5rem;line-height:1;font-weight:900;color:var(--teal);opacity:.28;pointer-events:none}
.feat-q{margin:0}
.feat-q p{margin:0 0 12px;font-size:1.0625rem;line-height:1.65}
.feat-q p:last-child{margin-bottom:0}
.feat-who{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.feat-who .ini{flex:0 0 44px;width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.125rem;background:linear-gradient(135deg,#27B5A4,#2D6FC0)}
.feat-who .name{font-weight:900;color:var(--ink)}
.feat-meta{color:var(--muted);font-size:.875rem}
.feat-note{opacity:.85}
/* Under Paolo's card. Two loose muted sentences used to sit here with a gap between them that read
   as a mistake on a wide screen and fine on a phone (Fady 2026-08-27). They are now ONE object with
   a job: it says why there is a single review, and it gives the visitor the way to send the next
   one. The only secondary CTA on the page, deliberately smaller than "Appeler".
   ONE COLUMN AT EVERY WIDTH (Fady 2026-08-27: the phone version was right, the desktop one wasn't).
   Text left, button under it, was: text in a 474px column beside a 212px button, which left a hole
   in the panel's bottom-right corner that no amount of vertical centring closed. */
.rev-ask{max-width:760px;margin-top:16px;background:var(--teal-soft);border:1px solid rgba(11,122,112,.22);border-radius:var(--r-card);padding:clamp(18px,2.6vw,26px);display:grid;justify-items:start;gap:18px}
.rev-ask p{margin:0;color:var(--ink)}
.rev-ask .rev-t{font-weight:800;font-size:clamp(1.0625rem,1rem + .3vw,1.1875rem);line-height:1.35;text-wrap:balance}
.rev-ask .rev-p{margin-top:8px;font-size:.9375rem;color:var(--muted);line-height:1.55;max-width:64ch;text-wrap:pretty}
.rev-ask .btn{justify-self:start;white-space:nowrap}
.rev-ask .btn-wa{background:#fff}
.rev-ask .btn-wa:hover,.rev-ask .btn-wa:focus-visible{background:#D8EAE7}

/* ---------- situations ---------- */
.segs{display:grid;gap:0;margin-top:8px;border-top:1px solid var(--line-ink)}
@media (min-width:700px){.segs{grid-template-columns:repeat(3,1fr);border-top:0;border-left:1px solid var(--line-ink)}}
.seg{padding:24px 0;border-bottom:1px solid var(--line-ink)}
@media (min-width:700px){.seg{border-bottom:0;border-right:1px solid var(--line-ink);padding:10px 26px}}
.seg h3{text-transform:var(--case-head);font-stretch:100%;letter-spacing:var(--track-head);font-size:clamp(1.1875rem,1.1rem + .35vw,1.25rem);margin-bottom:8px}
.seg p{margin:0;color:var(--text);font-size:.9875rem}

/* ---------- zone ---------- */
.towns{list-style:none;padding:0;margin:20px 0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;max-width:980px}
@media (min-width:700px){.towns{grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}}
.towns li{font-weight:600;color:var(--ink);font-size:.9375rem;display:flex;align-items:center;gap:10px;white-space:nowrap}
.towns li::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:var(--r-dot);background:var(--mark)}

/* ---------- FAQ ----------
   Rebuilt 2026-08-27 (Fady: "jittery, not smooth at all"). Three real faults, all invisible in a
   screenshot and all felt under the finger:
   1. .answer carried the bottom padding while its height was animated to 0. With border-box, a box
      cannot be shorter than its own padding, so every close stopped dead at 20px and then snapped
      to nothing when the panel unmounted. The padding now lives on the paragraph inside, so 0 is 0.
   2. The chevron's open state was keyed off [open], which JS keeps true until the close animation
      ENDS, so the arrow hung upside down for the whole close. It is keyed off .is-open now, and the
      [open] fallback is scoped to the no-JS page, where it is the only thing that can work.
   3. A 320ms "busy" lock swallowed the next click, which reads as a dead accordion. Gone: the
      script cancels the running animation and reverses from wherever it is. */
.faq{max-width:800px}
.faq details{border-bottom:1px solid var(--line-ink)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;padding:16px 0;font-weight:800;letter-spacing:var(--track-title);font-size:1.0625rem;color:var(--ink);
  user-select:none;-webkit-tap-highlight-color:transparent;transition:color .18s ease}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:0 0 14px;width:14px;height:14px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;rotate:45deg;translate:0 -4px;transition:rotate .3s cubic-bezier(.22,1,.36,1),translate .3s cubic-bezier(.22,1,.36,1)}
.faq details.is-open summary,.faq details.is-open summary::after{color:var(--teal)}
@media (hover:hover){.faq summary:hover{color:var(--teal)}}
.faq details.is-open summary::after{rotate:225deg;translate:0 4px}
.no-js .faq details[open] summary::after{rotate:225deg;translate:0 4px}
@media (prefers-reduced-motion:reduce){.faq summary::after,.faq summary{transition:none}}
.faq .answer{padding:0;overflow:hidden}
.faq .answer p{margin:0;padding-bottom:20px;max-width:68ch}

/* ---------- final call (left aligned, the number carries the page's own marker) ----------
   The number used to hang a detached 6px rule under itself, which is a fifth way of using yellow on
   a page that already has exactly one: the highlighter stroke (.hl, .p-amt, .cite). It now carries
   the SAME stroke as every price on the page, one step thicker because the type is five times
   bigger, and it grows on hover the way the cited fact does. (Fady 2026-08-27.) */
.finalcall h2{margin-bottom:10px}
.bignum{display:inline-block;font-size:clamp(2.6rem,1.5rem + 7vw,6rem);font-weight:900;font-stretch:82%;letter-spacing:-.01em;color:#fff;text-decoration:none;line-height:1.05;margin:10px 0 30px;padding-bottom:6px;
  background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-position:0 88%;background-size:100% .16em;
  transition:background-size .22s ease,color .18s ease}
.bignum:hover,.bignum:focus-visible{color:var(--mark);background-size:100% .3em}
.finalcall .actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:4px}
.finalcall .hours{color:var(--on-ink-muted);font-size:.9375rem;margin-top:22px;max-width:56ch}

/* ---------- footer ----------
   White, no yellow rule, no logo plate (Fady 2026-08-26). The dark final-call section above is the
   separator; the monogram has no white artwork (only its clip rect is white) so it sits on white
   unframed, and a size up. */
.site-footer{background:#fff;color:var(--muted);padding:clamp(44px,6vw,64px) 0 28px}
.site-footer .cols{display:grid;gap:44px;align-items:start}
@media (min-width:700px){.site-footer .cols{grid-template-columns:1.1fr 1fr;gap:64px}}
.foot-logo{display:inline-block;margin-bottom:18px}
.foot-logo img{height:44px;width:auto}
.site-footer a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
.site-footer a:hover{color:var(--cta)}
.site-footer .cols p{font-size:.9375rem;max-width:44ch}
.foot-tel{display:inline-block;font-size:1.5rem;font-weight:900;letter-spacing:var(--track-title);color:var(--ink);text-decoration:none;border-bottom:4px solid var(--mark);padding-bottom:4px;margin:6px 0 10px}
.foot-tel:hover{color:var(--cta)}
.site-footer .legal h2{font-size:.8125rem;color:var(--teal);text-transform:uppercase;letter-spacing:var(--track-label);font-weight:600;font-stretch:100%;padding-top:0;margin-bottom:12px}
.site-footer .legal p{font-size:.9375rem;line-height:1.7}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.foot-links a{font-size:.9375rem}
.foot-note{font-size:.8125rem;color:var(--muted);margin-top:10px;max-width:52ch}
.credit{margin:44px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--muted)}

/* ---------- sticky call bar ----------
   It arrives only once the hero's own CTA pair has scrolled out of view (Fady 2026-08-26): while
   the big buttons are on screen the bar is a duplicate. The .js gate is set by a blocking script in
   <head>, so the bar starts off-screen with no flash; without JS it simply stays visible, which is
   the safe failure for the page's main conversion element. Space for it is reserved by the body's
   padding-bottom either way, so nothing shifts when it slides in. */
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;gap:10px;background:var(--ink);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(16,42,74,.25);transition:transform var(--cb-dur) var(--cb-ease),opacity var(--cb-dur) ease}
/* translateY(0), never "none": interpolating a percentage transform against none is what made the
   bar jump instead of slide (Fady saw a flash of the page, then a pop). The state class lives on
   <html> so the floating badge can ride the same class and the same timing. */
.js .callbar{transform:translateY(calc(100% + 14px));opacity:0;pointer-events:none}
.js.cb-on .callbar{transform:translateY(0);opacity:1;pointer-events:auto}
.cb-call{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--cta);color:#fff;font-weight:800;font-size:1.0625rem;text-decoration:none;min-height:52px;border-radius:var(--r-btn)}
.cb-call:active{background:var(--cta-press)}
.cb-call svg{width:20px;height:20px;fill:currentColor}
.cb-wa{flex:0 0 68px;display:grid;place-items:center;background:var(--teal);border:0;border-radius:var(--r-btn);color:#fff}
.cb-wa:active{background:#08655D}
.cb-wa svg{width:26px;height:26px;fill:currentColor}
@media (min-width:1000px){.callbar{display:none}}
@media (prefers-reduced-motion:reduce){.callbar{transition:none}}

/* ---------- reveals (JS adds .in; no-js and reduced-motion stay visible; triggered BEFORE the
   element enters the viewport so nothing visibly pops, Fady 2026-08-26 morning) ---------- */
.js .rv{opacity:.001;transform:translate3d(0,10px,0);transition:opacity .4s ease-out,transform .45s ease-out;transition-delay:calc(var(--i,0) * 50ms)}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}}

/* ---------- floating guarantee badge (ported from v2 2026-08-26; made to EXPAND 2026-08-27) ----------
   The badge rides ON the call bar instead of sitting where the bar would be: it rests 14px off the
   bottom while the bar is away, and the bar's arrival pushes it up by exactly the bar's height, in
   the same duration and easing (--cb-dur / --cb-ease), so the two move as one. --cb-lift composes
   with the bye/away transform so a single transition covers both.
   WHAT CHANGED 2026-08-27 (Fady): it no longer pops a separate card ABOVE itself. The badge IS the
   card. The seal keeps its place against the right edge of the screen and the yellow box grows out
   of it leftwards, which is why the seal appears to travel left: it is pinned to the left edge of a
   box whose right edge never moves. Same content as the old popover, plus an X.
   The open height cannot be a CSS value (it depends on how the title wraps), so the script measures
   it once at the final width and animates to that pixel value, then releases it to auto. */
.guar-float{--cb-lift:0px;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:95;transform:translateY(var(--cb-lift));transition:transform var(--cb-dur) var(--cb-ease),opacity .35s ease}
.guar-float.guar-bye,.guar-float.guar-away{opacity:0;transform:translateY(calc(var(--cb-lift) + 10px));pointer-events:none}
/* only where the bar exists; from 1000px it is display:none and the badge keeps its own corner */
@media (max-width:999.98px){.cb-on .guar-float{--cb-lift:calc(-1 * var(--bar-h))}}
@media (min-width:1000px){.guar-float{right:24px;bottom:24px}}
/* the morphing box: a 78px yellow disc closed, a 340px yellow card open */
.guar-card{--guar-d:78px;position:relative;width:var(--guar-d);height:var(--guar-d);border-radius:50%;background:var(--mark);box-shadow:0 4px 18px rgba(16,42,74,.3);overflow:hidden;
  transition:width .42s cubic-bezier(.22,1,.36,1),height .42s cubic-bezier(.22,1,.36,1),border-radius .34s ease,box-shadow .34s ease}
@media (min-width:1000px){.guar-card{--guar-d:100px}}
/* Phones get the FULL width the screen allows (Fady 2026-08-27), tablets and desktop a fixed card:
   340px was one hair narrower than full width on a 375px phone, which just looked like a mistake. */
.guar-card.is-open{width:calc(100vw - 28px);border-radius:var(--r-card);box-shadow:0 14px 38px rgba(16,42,74,.38)}
@media (min-width:700px){.guar-card.is-open{width:360px}}
.guar-card.no-anim{transition:none}
/* The seal fills the disc when closed and lands in the open card VERTICALLY CENTRED, not pinned to
   the top (Fady 2026-08-27), carrying the same plate shadow as the badge in the guarantee band, so
   the two read as the same stamp rather than as a big one and a small flat one. */
.guar-fab{position:absolute;left:0;top:0;width:var(--guar-d);height:var(--guar-d);border-radius:50%;background:none;border:0;padding:0;cursor:pointer;
  transition:width .42s cubic-bezier(.22,1,.36,1),height .42s cubic-bezier(.22,1,.36,1),left .42s cubic-bezier(.22,1,.36,1),top .42s cubic-bezier(.22,1,.36,1),box-shadow .34s ease,transform .15s ease}
.guar-card.is-open .guar-fab{width:64px;height:64px;left:18px;top:calc(50% - 32px);box-shadow:0 4px 14px rgba(16,42,74,.22)}
.guar-fab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (hover:hover){.guar-card:not(.is-open) .guar-fab:hover{transform:scale(1.06)}}
/* the content: same hierarchy as v2's popover, laid out clear of the seal and of the X */
/* padding-left = the seal's 18px inset + its 64px + 16px of air */
.guar-pop{padding:20px 20px 20px 98px;opacity:0;visibility:hidden;transition:opacity .16s ease}
.guar-card.is-open .guar-pop{opacity:1;visibility:visible;transition:opacity .3s ease .14s}
.guar-pop h3{margin:0 0 6px;padding-right:26px;font-size:1.125rem;font-weight:900;color:var(--ink);text-transform:none;font-stretch:100%;letter-spacing:-.02em;line-height:1.25}
.guar-pop p{margin:0;font-weight:600;font-size:1.0625rem;color:var(--ink)}
.guar-x{position:absolute;right:8px;top:8px;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer;padding:0;opacity:0;visibility:hidden;transition:opacity .16s ease,background-color .18s ease}
.guar-card.is-open .guar-x{opacity:1;visibility:visible;transition:opacity .3s ease .14s,background-color .18s ease}
.guar-x:hover{background:rgba(16,42,74,.1)}
.guar-x svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.guar-x:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.guar-card,.guar-fab,.guar-pop,.guar-x{transition:none}}

.doc h2{font-size:clamp(1.35rem,1.15rem + 1vw,1.75rem);text-transform:none;font-stretch:100%;letter-spacing:var(--track-title);margin:34px 0 10px}

@media (min-width:1000px){.consent{left:auto;right:24px;bottom:24px;margin:0}}

.consent p{font-size:.9375rem;margin:0 0 12px}
.consent .c-btns{display:flex;gap:8px}
.consent .c-btns button{flex:1;font:inherit;font-weight:800;font-size:.9375rem;padding:10px 12px;cursor:pointer;border:2px solid var(--ink);background:#fff;color:var(--ink)}
